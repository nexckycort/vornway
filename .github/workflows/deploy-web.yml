name: Deploy Web

on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - main
    paths:
      - "apps/webapp/**"
      - ".github/workflows/deploy-web.yml"

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      pnpm_config_verify_deps_before_run: false
      PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.PUBLIC_VAPID_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm and bun
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false
          runtime: bun@latest
      - run: bun --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '@vornway/web...'

      - name: Build
        run: pnpm --filter @vornway/web run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: "apps/webapp"
          packageManager: bun
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy
