minimumReleaseAge: 4320 # minutes
minimumReleaseAgeExclude:
  - hono
  - portless

sharedWorkspaceLockfile: false

packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  lefthook: true
  prisma: true
  sharp: true
  workerd: true

catalog:
  resend: ^6.12.2
  portless: ^0.15.5
  hono: ^4.12.33
  zod: ^4.3.6
  wrangler: ^4.115.0

catalogs:
  auth:
    '@better-auth/expo': ^1.6.26
    better-auth: ^1.6.26
  tooling:
    '@biomejs/biome': ^2.5.4
  ui:
    tailwindcss: ^4.3.3
    tw-animate-css: ^1.4.0
  prisma:
    '@prisma/adapter-pg': ^7.9.1
    '@prisma/client': ^7.9.1
    prisma: ^7.9.1
  types:
    '@types/bun': latest
    '@types/node': ^24.13.3
    bun-types: latest
    typescript: ^7.0.2
